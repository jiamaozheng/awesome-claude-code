name: Sync Awesome Copilot Upstream

# No-op touch to force GitHub Actions to re-index this workflow.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "awesome-copilot git ref (branch/tag/sha)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-awesome-copilot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone awesome-copilot
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p .upstream
          git clone --depth 1 --branch "$SOURCE_REF" https://github.com/github/awesome-copilot.git .upstream/awesome-copilot-main

      - name: Sync files from upstream using inventory map
        run: |
          python3 scripts/sync_from_awesome.py \
            --source-root .upstream/awesome-copilot-main \
            --inventory docs/migration-inventory.csv \
            --repo-root . \
            --emit-unmapped-csv /tmp/new-inventory-rows.csv

      - name: Run migration validators
        run: |
          python3 scripts/validate_migration.py
          python3 scripts/validate_claude_assets.py
          python3 scripts/validate_claude_assets.py --strict
          python3 scripts/validate_plugins.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync from awesome-copilot upstream"
          title: "chore: sync from awesome-copilot upstream"
          body: |
            Automated upstream sync from https://github.com/github/awesome-copilot.

            This PR was generated by `.github/workflows/sync-awesome-copilot.yml` and:
            - synced mapped artifacts from `docs/migration-inventory.csv`
            - ran migration, Claude asset (strict), and plugin validators

            If all checks pass, this PR can be merged safely.
          branch: chore/sync-awesome-copilot
          delete-branch: true
          labels: |
            automation
            sync

  update-inventory:
    runs-on: ubuntu-latest
    needs: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone awesome-copilot
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p .upstream
          git clone --depth 1 --branch "$SOURCE_REF" https://github.com/github/awesome-copilot.git .upstream/awesome-copilot-main

      - name: Detect unmapped upstream files
        id: detect
        run: |
          python3 scripts/sync_from_awesome.py \
            --source-root .upstream/awesome-copilot-main \
            --inventory docs/migration-inventory.csv \
            --repo-root . \
            --dry-run \
            --emit-unmapped-csv /tmp/new-inventory-rows.csv
          if [ -s /tmp/new-inventory-rows.csv ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge new rows into inventory
        if: steps.detect.outputs.has_new == 'true'
        id: merge
        run: |
          python3 scripts/merge_inventory_rows.py \
            --new-rows /tmp/new-inventory-rows.csv \
            --inventory docs/migration-inventory.csv
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            echo "rows_added=true" >> "$GITHUB_OUTPUT"
          else
            echo "rows_added=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create inventory-update pull request
        if: steps.merge.outputs.rows_added == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add new upstream files to migration inventory"
          title: "chore: add new upstream files to migration inventory"
          body: |
            New files were detected in https://github.com/github/awesome-copilot that are
            not yet covered by `docs/migration-inventory.csv`.

            This PR adds candidate rows for review. Each row includes an inferred `type`
            (derived from the upstream directory name) — **please verify** the `type` is
            correct before merging and adjust the `target` path if needed.

            After merging, the daily sync job will automatically copy those files.
          branch: chore/inventory-update
          delete-branch: true
          labels: |
            automation
            inventory
